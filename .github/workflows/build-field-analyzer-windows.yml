name: Build Magnetic Field Analyzer Windows

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/build-field-analyzer-windows.yml'
      - 'tools/field_analyzer_windows/**'
      - 'updates/MagneticFieldAnalyzer_v1.zip'

permissions:
  contents: write

concurrency:
  group: field-analyzer-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Windows build dependencies
        run: 'python -m pip install --only-binary=:all: -r tools/field_analyzer_windows/requirements-build.txt'
      - name: Build and test Windows executable
        run: python tools/field_analyzer_windows/build.py
      - name: Store tested Windows ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MagneticFieldAnalyzer-1.0-Windows-x64
          path: |
            updates/MagneticFieldAnalyzer_v1.zip
            updates/MagneticFieldAnalyzer_v1.sha256
            updates/MagneticFieldAnalyzer_v1_Windows_x64.zip
            updates/MagneticFieldAnalyzer_v1_Windows_x64.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct-download ZIP
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- updates/MagneticFieldAnalyzer_v1_Windows_x64.zip updates/MagneticFieldAnalyzer_v1_Windows_x64.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Publish tested Magnetic Field Analyzer 1.0 Windows x64 build [skip ci]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:work
          exit $LASTEXITCODE
