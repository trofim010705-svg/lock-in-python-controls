name: Build Optical Magnetic Lab Windows

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/build-optical-lab-windows.yml'
      - 'tools/optical_lab_windows/**'
      - 'updates/OpticalMagneticLab_v1_1.zip'

permissions:
  contents: write

concurrency:
  group: optical-lab-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Windows build dependencies
        run: 'python -m pip install --only-binary=:all: -r tools/optical_lab_windows/requirements-build.txt'
      - name: Build and test Windows executable
        run: python tools/optical_lab_windows/build.py
      - name: Store portable Windows ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpticalMagneticLab-1.1-Windows-x64
          path: |
            updates/OpticalMagneticLab_v1_1.zip
            updates/OpticalMagneticLab_v1_1.sha256
            updates/OpticalMagneticLab_v1_1_Windows_x64.zip
            updates/OpticalMagneticLab_v1_1_Windows_x64.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'optical-magnetic-lab-v1.1'
          gh release create $tag updates/OpticalMagneticLab_v1_1.zip updates/OpticalMagneticLab_v1_1.sha256 updates/OpticalMagneticLab_v1_1_Windows_x64.zip updates/OpticalMagneticLab_v1_1_Windows_x64.sha256 --target $env:GITHUB_SHA --title 'Optical Magnetic Lab 1.1: isolated NI driver compatibility' --notes 'Independent Qt-free NI worker executable; system NI C API nicaiu by default; read-only comparison of empty tasks through nicaiu/nicai_utf8 via diagnose_ni.bat; diagnostic runtime metadata and repeated-error throttling. Retains all optical formulas, Dual Harmonic acquisition, scan modes, data exports and hold/explicit-zero policy. Windows demos checked in ASCII and Cyrillic paths; physical NI driver compatibility requires testing on the target computer.'
          exit $LASTEXITCODE
