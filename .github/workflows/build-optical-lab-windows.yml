name: Build Optical Magnetic Lab Windows

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/build-optical-lab-windows.yml'
      - 'tools/optical_lab_windows/**'
      - 'updates/OpticalMagneticLab_v1.zip'

permissions:
  contents: write

concurrency:
  group: optical-lab-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Windows build dependencies
        run: 'python -m pip install --only-binary=:all: -r tools/optical_lab_windows/requirements-build.txt'
      - name: Build and test Windows executable
        run: python tools/optical_lab_windows/build.py
      - name: Store portable Windows ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpticalMagneticLab-1.0-Windows-x64
          path: |
            updates/OpticalMagneticLab_v1.zip
            updates/OpticalMagneticLab_v1.sha256
            updates/OpticalMagneticLab_v1_Windows_x64.zip
            updates/OpticalMagneticLab_v1_Windows_x64.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'optical-magnetic-lab-v1'
          gh release create $tag updates/OpticalMagneticLab_v1_Windows_x64.zip updates/OpticalMagneticLab_v1_Windows_x64.sha256 --target $env:GITHUB_SHA --title 'Optical Magnetic Lab 1.0: NI AO0 and Dual Harmonic optics' --notes 'Bipolar NI AO0 control (-5..5 V), RSE AI1/AI0 photodiodes x25.2, Hall AI3, internal 1f/2f Lock-in acquisition, angular-second amplitudes, Faraday twin axes and centered hysteresis. Continuous sweeps, fixed field, raw NI streams, hold/explicit zero. Windows executable verified with simulated instruments in ASCII and Cyrillic paths.'
          exit $LASTEXITCODE
