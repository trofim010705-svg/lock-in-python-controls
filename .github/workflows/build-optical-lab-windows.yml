name: Build Optical Magnetic Lab Windows

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/build-optical-lab-windows.yml'
      - 'tools/optical_lab_windows/**'
      - 'updates/OpticalMagneticLab_v1_2.zip'

permissions:
  contents: write

concurrency:
  group: optical-lab-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Windows build dependencies
        run: 'python -m pip install --only-binary=:all: -r tools/optical_lab_windows/requirements-build.txt'
      - name: Build and test Windows executable
        run: python tools/optical_lab_windows/build.py
      - name: Store portable Windows ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpticalMagneticLab-1.2-Windows-x64
          path: |
            updates/OpticalMagneticLab_v1_2.zip
            updates/OpticalMagneticLab_v1_2.sha256
            updates/OpticalMagneticLab_v1_2_Windows_x64.zip
            updates/OpticalMagneticLab_v1_2_Windows_x64.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'optical-magnetic-lab-v1.2'
          gh release create $tag updates/OpticalMagneticLab_v1_2.zip updates/OpticalMagneticLab_v1_2.sha256 updates/OpticalMagneticLab_v1_2_Windows_x64.zip updates/OpticalMagneticLab_v1_2_Windows_x64.sha256 --target $env:GITHUB_SHA --title 'Optical Magnetic Lab 1.2: dark subtraction and oscillator controls' --notes 'Handles unsupported AO_IdleOutputBehavior (-200452) using native on-demand DAC behavior without implicit zero writes. Adds two dark voltages after x25.2, corrected live displays and optical normalization, raw/scaled/corrected exports. Main-page oscillator amplitude/frequency controls with actual readback recorded before/after each point. Visible save-defaults button restores fields without changing instruments. Retains independent Qt-free NI worker, scan modes, Faraday plots and hold/explicit-zero policy. Windows demo checks include dark subtraction, oscillator apply/read and metadata, defaults, ASCII/Cyrillic paths. Physical hardware compatibility requires testing on the target computer.'
          exit $LASTEXITCODE
