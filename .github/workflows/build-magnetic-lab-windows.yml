name: Build Magnetic Lab Windows

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/build-magnetic-lab-windows.yml'
      - 'tools/magnetic_lab_windows/**'
      - 'updates/MagneticLab_v1_4.zip'

permissions:
  contents: write

concurrency:
  group: magnetic-lab-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Windows build dependencies
        run: 'python -m pip install --only-binary=:all: -r tools/magnetic_lab_windows/requirements-build.txt'
      - name: Build and test Windows executable
        run: python tools/magnetic_lab_windows/build.py
      - name: Store portable Windows ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MagneticLab-1.4-Windows-x64
          path: |
            updates/MagneticLab_v1_4.zip
            updates/MagneticLab_v1_4.sha256
            updates/MagneticLab_v1_4_Windows_x64.zip
            updates/MagneticLab_v1_4_Windows_x64.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'magnetic-lab-v1-4'
          gh release create $tag updates/MagneticLab_v1_4_Windows_x64.zip updates/MagneticLab_v1_4_Windows_x64.sha256 --target $env:GITHUB_SHA --title 'Magnetic Lab 1.4: continuous hysteresis sweep' --notes 'Separate hysteresis button: start to stop and back in one experiment. Shared turning point, 2N+1 points, distinct branches in plots and metadata. Preserves current on Stop, errors and reconnect; optional finish-zero applies only after the whole loop. Windows x64 executable tested with simulated instruments in ASCII and Cyrillic paths.'
          exit $LASTEXITCODE
