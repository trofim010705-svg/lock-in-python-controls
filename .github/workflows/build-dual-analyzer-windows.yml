name: Build Pump Probe Dual Analyzer Windows

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/build-dual-analyzer-windows.yml'
      - 'tools/dual_analyzer_windows/**'
      - 'updates/PumpProbeDualAnalyzer_v8_3.zip'

permissions:
  contents: write

concurrency:
  group: dual-analyzer-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install native build dependencies
        run: 'python -m pip install --only-binary=:all: -r tools/dual_analyzer_windows/requirements-build.txt'
      - name: Build and verify theory model in Windows EXE
        run: python tools/dual_analyzer_windows/build.py
      - name: Store tested Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PumpProbeDualAnalyzer-v8.3-Windows-x64
          path: |
            updates/PumpProbeDualAnalyzer_v8_3.zip
            updates/PumpProbeDualAnalyzer_v8_3.sha256
            updates/PumpProbeDualAnalyzer_v8_3_Windows_x64.zip
            updates/PumpProbeDualAnalyzer_v8_3_Windows_x64.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'pump-probe-dual-analyzer-v8-3'
          gh release create $tag updates/PumpProbeDualAnalyzer_v8_3_Windows_x64.zip updates/PumpProbeDualAnalyzer_v8_3_Windows_x64.sha256 --target $env:GITHUB_SHA --title 'Pump-Probe Dual Analyzer v8.3: angular frequency shifts' --notes 'Delta omega = 2*pi*delta f in captions, equations, fix-value controls and exports. Angular shifts and uncertainties are numerically converted to rad/ns or rad/s; the model uses delta phi + delta omega*t. Radian calibration and compact reports retained. Windows x64 executable tested in ASCII and Cyrillic paths.'
          exit $LASTEXITCODE
